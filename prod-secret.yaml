# prod-secret.yaml - raw Kubernetes Secret (delete after sealing)
# seal via: kubeseal < prod-secret.yaml > sealed-secret.yaml --format yaml
# secure deletion: shred -u prod-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: prod-secrets
  namespace: default
type: Opaque
stringData:
  BINANCE_KEY: <REPLACE_ME>
  BINANCE_SECRET: <REPLACE_ME>
  SMTP_USER: <REPLACE_ME>
  SMTP_PASS: <REPLACE_ME>
  JWT_SECRET: <REPLACE_ME>
  WALLET_ADDRESS: <REPLACE_ME>
