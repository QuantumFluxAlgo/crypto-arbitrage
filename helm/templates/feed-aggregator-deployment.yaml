apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-aggregator
  labels:
    app: feed-aggregator
    {{- include "crypto-arbitrage.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: feed-aggregator
  template:
    metadata:
      labels:
        app: feed-aggregator
    spec:
      containers:
        - name: feed-aggregator
          image: {{ .Values.feedAggregator.image }}
          ports:
            - containerPort: {{ .Values.feedAggregator.port }}
          resources: {{- toYaml .Values.feedAggregator.resources | nindent 12 }}
          envFrom:
            - secretRef:
                name: feed-aggregator-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.feedAggregator.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.feedAggregator.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: feed-aggregator
  labels:
    app: feed-aggregator
spec:
  type: ClusterIP
  selector:
    app: feed-aggregator
  ports:
    - port: {{ .Values.feedAggregator.port }}
      targetPort: {{ .Values.feedAggregator.port }}
