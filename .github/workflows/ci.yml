name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
      - name: Run environment verifier
        run: bash test/verify-env.sh

  validate:
    needs: verify-env
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
      - name: Install kubectl and jq
        run: |
          sudo apt-get update
          sudo apt-get -y install kubectl jq
      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate Kubernetes YAML
        run: kubeconform -strict -ignore-missing-schemas -summary infra/k8s/
      - name: Dry-run apply manifests
        run: kubectl apply --dry-run=client -f infra/k8s/
      - name: Validate release workflow
        run: bash test/verify-release-workflow.sh

  api:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610
        with:
          node-version: 18
      - uses: actions/cache@2f8e54208210a422b2efd51efaa6bd6d7ca8920f
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('api/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
        working-directory: api
      - name: Run API tests
        run: |
          mkdir -p ../test-results
          npm test -- --coverage --coverageThreshold='{"global":{"branches":80,"functions":80,"lines":80,"statements":80}}' --json --outputFile=../test-results/api-jest.json
        working-directory: api
      - name: Upload API coverage
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: api-coverage
          path: api/coverage
      - name: Upload API test report
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: api-jest-report
          path: test-results/api-jest.json
      - name: Run API ESLint
        run: npx eslint .
        working-directory: api
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get -y install podman
      - name: Build api image
        run: podman build -t api ./api
      - name: Run Trivy scan on api
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4
        with:
          image-ref: api
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1

  dashboard:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610
        with:
          node-version: 18
      - uses: actions/cache@2f8e54208210a422b2efd51efaa6bd6d7ca8920f
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('dashboard/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
        working-directory: dashboard
      - name: Run Dashboard tests
        run: |
          mkdir -p ../test-results
          npx jest --coverage --coverageThreshold='{"global":{"branches":80,"functions":80,"lines":80,"statements":80}}' --json --outputFile=../test-results/dashboard-jest.json
        working-directory: dashboard
      - name: Upload Dashboard coverage
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: dashboard-coverage
          path: dashboard/coverage
      - name: Upload Dashboard test report
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: dashboard-jest-report
          path: test-results/dashboard-jest.json
      - name: Run Dashboard ESLint
        run: npx eslint .
        working-directory: dashboard
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get -y install podman
      - name: Build dashboard image
        run: podman build -t dashboard ./dashboard
      - name: Run Trivy scan on dashboard
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4
        with:
          image-ref: dashboard
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1

  feed-aggregator:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610
        with:
          node-version: 18
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: '3.10'
      - uses: actions/cache@2f8e54208210a422b2efd51efaa6bd6d7ca8920f
        with:
          path: |
            ~/.npm
            ~/.cache/pip
          key: ${{ runner.os }}-fa-${{ hashFiles('feed-aggregator/package-lock.json') }}-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        run: npm ci
        working-directory: feed-aggregator
      - name: Run feed-aggregator tests
        run: |
          mkdir -p ../test-results
          pytest --junitxml=../test-results/feed-aggregator-pytest.xml
        working-directory: feed-aggregator
      - name: Upload feed-aggregator test report
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: feed-aggregator-pytest-report
          path: test-results/feed-aggregator-pytest.xml
      - name: Run feed-aggregator ESLint
        run: npx eslint .
        working-directory: feed-aggregator
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get -y install podman
      - name: Build feed-aggregator image
        run: podman build -t feed-aggregator ./feed-aggregator
      - name: Run Trivy scan on feed-aggregator
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4
        with:
          image-ref: feed-aggregator
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1

  analytics:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: '3.10'
      - uses: actions/cache@2f8e54208210a422b2efd51efaa6bd6d7ca8920f
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      - name: Install Python dependencies
        run: pip install -r requirements.txt pylint
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get -y install podman
      - name: Run Analytics tests
        run: |
          mkdir -p ../test-results
          pytest --cov=analytics --cov-report=xml:../test-results/analytics-coverage.xml --cov-fail-under=80 --junitxml=../test-results/analytics-pytest.xml
        working-directory: analytics
      - name: Upload analytics coverage
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: analytics-coverage
          path: test-results/analytics-coverage.xml
      - name: Run Pylint
        run: pylint analytics/ --fail-under=9
      - name: Upload analytics test report
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: analytics-pytest-report
          path: test-results/analytics-pytest.xml
      - name: Run flake8
        run: flake8 analytics/
      - name: Build analytics image
        run: podman build -t analytics ./analytics
      - name: Test analytics container
        run: podman run --rm analytics python --version
      - name: Run Trivy scan on analytics
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4
        with:
          image-ref: analytics
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1

  executor:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
      - uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/cache@2f8e54208210a422b2efd51efaa6bd6d7ca8920f
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('executor/*.gradle*') }}
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get -y install podman
      - name: Run Executor tests
        run: |
          mkdir -p ../test-results/executor
          ./gradlew test jacocoTestReport jacocoTestCoverageVerification
          cp -r build/test-results/test ../test-results/executor || true
          cp build/reports/jacoco/test/jacocoTestReport.xml ../test-results/executor/jacoco.xml || true
        working-directory: executor
      - name: Upload Executor test report
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: executor-gradle-report
          path: test-results/executor
      - name: Upload Executor coverage
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: executor-coverage
          path: test-results/executor/jacoco.xml
      - name: Build executor image
        run: podman build -t executor ./executor
      - name: Test executor container
        run: podman run --rm executor java -version
      - name: Run Trivy scan on executor
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4
        with:
          image-ref: executor
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1

  behavior-tests:
    needs:
      - api
      - dashboard
      - feed-aggregator
      - analytics
      - executor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
      - name: Install kubectl and jq
        run: |
          sudo apt-get update
          sudo apt-get -y install kubectl jq
      - name: Run behavior simulation tests
        run: bash scripts/test-behavior.sh

  live-server-tests:
    needs: behavior-tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && secrets.XEON_HOST != ''
    steps:
      - name: Run live tests on Xeon server
        uses: appleboy/ssh-action@d91a1af6f57cd4478ceee14d7705601dafabaa19
        with:
          host: ${{ secrets.XEON_HOST }}
          username: ${{ secrets.XEON_USER }}
          key: ${{ secrets.XEON_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/prism-arbitrage
            git pull |& sed 's/^/[test:live] /'
            ./test/run-live.sh |& sed 's/^/[test:live] /'
