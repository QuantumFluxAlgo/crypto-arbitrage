apiVersion: v1
kind: ConfigMap
metadata:
  name: prism-grafana-dashboard
  labels:
    grafana_dashboard: "1"
data:
  prism-dashboard.json: |
    {
      "title": "Prism Arbitrage Overview",
      "panels": [
        {
          "type": "graph",
          "title": "Trading Status",
          "datasource": "Prometheus",
          "targets": [{ "expr": "system_paused{source=\"api\"}" }],
          "options": {"steppedLine": true}
        },
        {
          "type": "graph",
          "title": "Panic State",
          "datasource": "Prometheus",
          "targets": [{ "expr": "panic_state" }],
          "options": {"steppedLine": true}
        },
        {
          "type": "graph",
          "title": "Resume Events",
          "datasource": "Prometheus",
          "targets": [{ "expr": "resume_event_total" }]
        },
        {
          "type": "graph",
          "title": "Strategy Latency",
          "datasource": "Prometheus",
          "targets": [{ "expr": "spread_evaluation_latency_ms" }]
        },
        {
          "type": "graph",
          "title": "Win Rate %",
          "datasource": "Prometheus",
          "targets": [{ "expr": "win_rate_pct" }]
        },
        {
          "type": "graph",
          "title": "Pod Memory Usage",
          "datasource": "Prometheus",
          "targets": [{ "expr": "container_memory_usage_bytes{pod=~\".+\"}" }]
        },
        {
          "type": "graph",
          "title": "Pod CPU Usage",
          "datasource": "Prometheus",
          "targets": [{ "expr": "container_cpu_usage_seconds_total{pod=~\".+\"}" }]
        }
      ],
      "schemaVersion": 36,
      "version": 1
    }
