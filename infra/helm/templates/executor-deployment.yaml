apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
  labels:
    app: executor
    {{- include "crypto-arbitrage.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: executor
  template:
    metadata:
      labels:
        app: executor
    spec:
      serviceAccountName: {{ .Release.Name }}-executor
      containers:
        - name: executor
          image: {{ .Values.executor.image }}
          imagePullPolicy: {{ .Values.executor.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.executor.metricsPort }}
          resources: {{- toYaml .Values.executor.resources | nindent 12 }}
          {{- if eq .Values.global.mode "sandbox" }}
          env:
            - name: REDIS_URL
              value: {{ printf "redis://default:%s@redis:6379" .Values.redis.auth.password }}
          {{- else }}
          envFrom:
            - secretRef:
                name: prod-secrets
          {{- end }}
          volumeMounts:
            - name: prism-logs
              mountPath: /var/log/prism
          readinessProbe:
            exec:
              command: ["pgrep", "-f", "Executor"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "Executor"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: prism-logs
          hostPath:
            path: /var/log/prism
            type: DirectoryOrCreate
