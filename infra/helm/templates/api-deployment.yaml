apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
    {{- include "crypto-arbitrage.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: {{ .Release.Name }}-api
      containers:
        - name: api
          image: {{ .Values.api.image }}
          imagePullPolicy: {{ .Values.api.imagePullPolicy }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 3000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          ports:
            - containerPort: {{ .Values.api.port }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          {{- if eq .Values.global.mode "sandbox" }}
          env:
            - name: REDIS_URL
              value: {{ printf "redis://default:%s@redis:6379" .Values.redis.auth.password }}
          {{- else }}
          envFrom:
            - secretRef:
                name: prod-secrets
          {{- end }}
          volumeMounts:
            - name: prism-logs
              mountPath: /var/log/prism
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            failureThreshold: 3
            periodSeconds: 10
      volumes:
        - name: prism-logs
          hostPath:
            path: /var/log/prism
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/api/metrics"
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
