apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-aggregator
  labels:
    app: feed-aggregator
    {{- include "crypto-arbitrage.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: feed-aggregator
  template:
    metadata:
      labels:
        app: feed-aggregator
    spec:
      serviceAccountName: {{ .Release.Name }}-feed-aggregator
      containers:
        - name: feed-aggregator
          image: {{ .Values.feedAggregator.image }}
          ports:
            - containerPort: {{ .Values.feedAggregator.port }}
          resources: {{- toYaml .Values.feedAggregator.resources | nindent 12 }}
          envFrom:
            - secretRef:
                name: prod-secrets
          volumeMounts:
            - name: prism-logs
              mountPath: /var/log/prism-arbitrage
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.feedAggregator.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.feedAggregator.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: prism-logs
          hostPath:
            path: /var/log/prism-arbitrage
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: feed-aggregator
  labels:
    app: feed-aggregator
spec:
  type: ClusterIP
  selector:
    app: feed-aggregator
  ports:
    - port: {{ .Values.feedAggregator.port }}
      targetPort: {{ .Values.feedAggregator.port }}
