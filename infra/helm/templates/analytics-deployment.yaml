apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  labels:
    app: analytics
    {{- include "crypto-arbitrage.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      serviceAccountName: {{ .Release.Name }}-analytics
      containers:
        - name: analytics
          image: {{ .Values.analytics.image }}
          imagePullPolicy: {{ .Values.analytics.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.analytics.port }}
          resources: {{- toYaml .Values.analytics.resources | nindent 12 }}
          {{- if eq .Values.global.mode "sandbox" }}
          env:
            - name: REDIS_URL
              value: {{ printf "redis://default:%s@redis:6379" .Values.redis.auth.password }}
          {{- else }}
          envFrom:
            - secretRef:
                name: prod-secrets
          {{- end }}
          volumeMounts:
            - name: prism-logs
              mountPath: /var/log/prism-arbitrage
          readinessProbe:
            httpGet:
              path: /ping
              port: {{ .Values.analytics.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: {{ .Values.analytics.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: prism-logs
          hostPath:
            path: /var/log/prism-arbitrage
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: analytics
  labels:
    app: analytics
spec:
  type: ClusterIP
  selector:
    app: analytics
  ports:
    - port: {{ .Values.analytics.port }}
      targetPort: {{ .Values.analytics.port }}
