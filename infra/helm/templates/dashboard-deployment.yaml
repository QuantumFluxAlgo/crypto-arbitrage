apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels:
    app: dashboard
    {{- include "crypto-arbitrage.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      serviceAccountName: {{ .Release.Name }}-dashboard
      containers:
        - name: dashboard
          image: {{ .Values.dashboard.image }}
          imagePullPolicy: {{ .Values.dashboard.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.dashboard.port }}
          resources: {{- toYaml .Values.dashboard.resources | nindent 12 }}
          {{- if eq .Values.global.mode "sandbox" }}
          env:
            - name: REDIS_URL
              value: {{ printf "redis://default:%s@redis:6379" .Values.redis.auth.password }}
          {{- else }}
          envFrom:
            - secretRef:
                name: prod-secrets
          {{- end }}
          volumeMounts:
            - name: prism-logs
              mountPath: /var/log/prism-arbitrage
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.dashboard.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.dashboard.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: prism-logs
          hostPath:
            path: /var/log/prism-arbitrage
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  labels:
    app: dashboard
spec:
  type: ClusterIP
  selector:
    app: dashboard
  ports:
    - port: {{ .Values.dashboard.port }}
      targetPort: {{ .Values.dashboard.port }}
