# Helm default values for Kubernetes deployment
global:
  mode: sandbox
executionMode: sandbox
replicaCount: 1
gitCommit: "unset"
environment: "unset"
# SealedSecrets required — CI fails if plain Secrets are used
secrets:
  useSealed: true  # must remain true; unsealed secrets are rejected in CI

# ---------------------------------------------------------------------
# Service-level configuration
# ---------------------------------------------------------------------

api:
  image: api-local
  imagePullPolicy: Never
  port: 8080
  resources:
    requests:
      cpu: "10m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"
  env: {}

analytics:
  image: arb-analytics
  imagePullPolicy: Never
  port: 5000
  resources:
    requests:
      cpu: "10m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"
  env:
    # MODEL_PATH: "/models/model.h5"
    # GPU_ENABLED: "true"
    # LOG_LEVEL: "INFO"

dashboard:
  image: arb-dashboard
  imagePullPolicy: Never
  port: 3000
  resources:
    requests:
      cpu: "10m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"
  env:
    # PUBLIC_URL: "https://arb.example.com"
    # NODE_ENV: "production"

executor:
  image: arb-executor
  imagePullPolicy: Never
  metricsPort: 9100
  resources:
    requests:
      cpu: "10m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"
  env:
    # REDIS_URL: "redis://redis:6379"
    # ANALYTICS_URL: "http://analytics:5000/trade"
    # PERSONALITY_MODE: "REALISTIC"
    # STARTING_BALANCE: "10000"

feedAggregator:
  image: arb-feed-aggregator
  imagePullPolicy: Never
  port: 8090
  resources:
    requests:
      cpu: "10m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"
  env:
    # FEED_URL: "wss://example.com/feed"
    # REDIS_URL: "redis://redis:6379"
    # ORDERBOOK_CHANNEL: "orderbook"
    # ALERT_CHANNEL: "alerts"

redis:
  auth:
    password: testpassword
  image: redis:7.2-alpine
  imagePullPolicy: Never
  resources:
    requests:
      cpu: "10m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"
  # uses emptyDir for non-persistent storage

postgres:
  image: postgres:16-alpine
  imagePullPolicy: Never
  resources:
    requests:
      cpu: "10m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"
  # uses emptyDir for non-persistent storage

logForwarder:
  enabled: true
  image: grafana/fluent-bit-plugin-loki:latest

