apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-aggregator
  labels:
    app: feed-aggregator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: feed-aggregator
  template:
    metadata:
      labels:
        app: feed-aggregator
    spec:
      containers:
        - name: feed-aggregator
          image: arb-feed-aggregator
          ports:
            - containerPort: 8090
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          envFrom:
            - secretRef:
                name: feed-aggregator-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: feed-aggregator
  labels:
    app: feed-aggregator
spec:
  type: ClusterIP
  selector:
    app: feed-aggregator
  ports:
    - port: 8090
      targetPort: 8090
